name: GenSolar Web Checks

on:
  push:
    branches: [main]
    paths:
      - "web-app/**"
      - ".github/workflows/web-checks.yml"
  pull_request:
    paths:
      - "web-app/**"
      - ".github/workflows/web-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Type-check and production build
        run: npm run build
      - name: Run UI smoke tests
        run: npm test
